<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Good to have you." />
  <meta name="keywords" content="No need just skip" />
  <meta name="author" content="Your Project or Team Name" />

  <!-- Open Graph (Social Media Preview) -->
  <meta property="og:title" content="Good to have you" />
  <meta property="og:description" content="No need just skip." />
  <meta property="og:image" content="https://yourdomain.com/assets/og-image.jpg" />
  <meta property="og:url" content="https://yourdomain.com/login.html" />
  <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-coins"></i> Pi Network Transfer</h1>
            <button class="theme-toggle" id="themeToggle">🌓</button>
            <button id="logoutBtn" class="logout-btn">
                🔒 Logout
            </button>
            
        </header>

        <form id="transferForm">
            <div class="form-group">
                <label for="senderSecret"><i class="fas fa-key"></i> Your Secret Key:</label>
                <input type="password" id="senderSecret" required placeholder="Enter your secret key">
            </div>

            <div class="form-group">
                <label for="recipient"><i class="fas fa-wallet"></i> Recipient Wallet Address:</label>
                <input type="text" id="recipient" required placeholder="Enter recipient address">
            </div>

            <div class="form-group">
                <label for="customAmount"><i class="fas fa-money-bill-wave"></i> Custom Amount (optional):</label>
                <input type="number" id="customAmount" placeholder="Leave empty to send full available balance">
                <small class="hint">Leaves 2 Pi as reserve if empty.</small>
            </div>

            <div class="controls">
                <button type="button" id="addMonitorBtn">
                    <i class="fas fa-plus"></i> Add to Monitor
                </button>
                <button type="button" id="withdrawNowBtn">
                    <i class="fas fa-bolt"></i> Withdraw Now
                </button>
                <button type="button" id="stopMonitorBtn">
                    <i class="fas fa-stop"></i> Stop Monitoring
                </button>
            </div>
        </form>

        <div id="output">
            <p class="info">[System] Ready</p>
        </div>
    </div>

    <div class="nav-links-container">
        <a href="index.html" class="nav-link">
            <i class="fas fa-exchange-alt"></i> Transfer
        </a>
        <a href="generate.html" class="nav-link">
            <i class="fas fa-key"></i> Generate
        </a>
        <a href="monitor.html" class="nav-link">
            <i class="fas fa-eye"></i> Monitor
        </a>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
    // Theme toggle logic
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = themeToggle.querySelector('i');
            if (icon) {
                icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        });

        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        const icon = themeToggle.querySelector('i');
        if (icon) {
            icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
    });
    </script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                const confirmLogout = confirm("Are you sure you want to logout?");
                if (!confirmLogout) return;
    
                try {
                    const response = await fetch('/logout', { method: 'POST' });
                    const result = await response.json();
                    if (result.success) {
                        alert('✅ Logged out successfully.');
                        window.location.href = '/login.html';
                    } else {
                        alert('❌ Logout failed.');
                    }
                } catch (error) {
                    console.error('Logout Error:', error);
                    alert('❌ Error during logout.');
                }
            });
        }
    });
    </script>
    
</body>
</html>
